<style>
    .tabular-digits {
      font-variant-numeric: tabular-nums;
    }
    .hud-hero-bpm {
      font-size: 124px;
      line-height: 108px;
      letter-spacing: -0.05em;
    }

      background: radial-gradient(110% 45% at 50% 0%, rgba(253, 89, 33, 0.18) 0%, rgba(189, 207, 115, 0.12) 35%, rgba(11, 15, 25, 0.98) 78%, #010f1f 100%), #010f1f;

<body class="bg-surface-container-lowest text-on-surface select-none antialiased overflow-hidden w-screen h-screen">
<div class="relative w-full h-full max-w-md mx-auto flex flex-col justify-between p-4 hero-bg-gradient">
<!-- SECTION 1: TOP TELEMETRY STATUS BAR -->
<header class="w-full pt-1 flex items-center justify-between gap-2 z-10">
<!-- Connected Sensor Pill -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low/90 border border-outline-variant/60 shadow-sm backdrop-blur-sm">
<span class="w-2.5 h-2.5 rounded-full bg-primary flex-shrink-0"></span>
<span class="font-label-sm text-label-sm tracking-wider text-on-surface-variant uppercase tabular-digits">
          COOSPO H808S · 95%
        </span>
</div>
<!-- Live Recording Badge -->
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low/90 border border-secondary-container/50 shadow-sm backdrop-blur-sm">
<span class="w-2.5 h-2.5 rounded-full bg-secondary-container flex-shrink-0 animate-ping"></span>
<span class="font-label-sm text-label-sm font-extrabold text-on-surface uppercase tracking-widest">
          RECORDING
        </span>
</div>
</header>
<!-- SECTION 2: CENTER TELEMETRY HERO FOCUS -->
<main class="w-full flex flex-col items-center justify-center my-auto z-10">
<div class="flex flex-col items-center">
<!-- Giant Tabular BPM Display (Zero Decorative Noise) -->
<span class="font-display-xl font-extrabold text-on-surface tabular-digits hud-hero-bpm">
          154
        </span>
<!-- Distinct Zone Pill Indicator -->
<div class="mt-3 flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary-container text-on-primary border border-primary">
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="speed">speed</span>
<span class="font-label-md text-label-md font-extrabold tracking-widest uppercase">
            BPM | ZONE 3 (TEMPO)
          </span>
</div>
</div>
<!-- SECTION 3: 5-SEGMENT HORIZONTAL ZONE PROGRESS BAR -->
<div class="w-full mt-8 px-2">
<div class="grid grid-cols-5 gap-1.5 w-full h-2.5">
<!-- Segment 1: Warmup -->
<div class="rounded-full bg-on-surface/50 border border-transparent"></div>
<!-- Segment 2: Aerobic Base -->
<div class="rounded-full bg-on-surface/50 border border-transparent"></div>
<!-- Segment 3: ACTIVE TEMPO -->
<div class="rounded-full bg-primary border-2 border-on-surface shadow-[0_0_12px_rgba(189,207,115,0.7)]"></div>
<!-- Segment 4: Threshold -->
<div class="rounded-full bg-surface-container-high/60 border border-outline-variant/30"></div>
<!-- Segment 5: Anaerobic -->
<div class="rounded-full bg-surface-container-high/60 border border-outline-variant/30"></div>
</div>
<!-- Micro Zone Labels -->
<div class="grid grid-cols-5 text-center mt-2.5 font-label-sm text-label-sm text-on-surface-variant font-bold tabular-digits">
<span class="opacity-60">Z1</span>
<span class="opacity-60">Z2</span>
<span class="text-primary font-extrabold tracking-wider">Z3 TEMPO</span>
<span class="opacity-40">Z4</span>
<span class="opacity-40">Z5</span>
</div>
</div>
<!-- SECTION 4: SINGLE-METRIC DURATION CARD -->
<div class="w-full mt-7 p-4 rounded-xl bg-surface-container-low border border-outline-variant text-center">
<div class="font-label-sm text-label-sm font-bold uppercase tracking-widest text-on-surface-variant">
          EFFECTIVE DURATION
        </div>
<div class="font-display-xl-mobile text-[46px] leading-tight font-extrabold text-on-surface tabular-digits mt-1 tracking-tight" id="workoutTimer">
          00:38:42
        </div>
</div>
<!-- SECTION 5: SECONDARY GLANCEABLE TELEMETRY STRIP -->
<div class="w-full grid grid-cols-3 gap-2 mt-3 px-1">
<div class="bg-surface-container/80 border border-outline-variant/50 rounded-lg p-2.5 flex flex-col items-center justify-center">
<span class="font-label-sm text-[10px] leading-tight text-on-surface-variant uppercase tracking-wider">AVG BPM</span>
<span class="font-label-lg text-label-lg font-bold text-on-surface tabular-digits mt-0.5">148</span>
</div>
<div class="bg-surface-container/80 border border-outline-variant/50 rounded-lg p-2.5 flex flex-col items-center justify-center">
<span class="font-label-sm text-[10px] leading-tight text-on-surface-variant uppercase tracking-wider">MAX BPM</span>
<span class="font-label-lg text-label-lg font-bold text-on-surface tabular-digits mt-0.5">161</span>
</div>
<div class="bg-surface-container/80 border border-outline-variant/50 rounded-lg p-2.5 flex flex-col items-center justify-center">
<span class="font-label-sm text-[10px] leading-tight text-on-surface-variant uppercase tracking-wider">TARGET RANGE</span>
<span class="font-label-lg text-label-lg font-bold text-primary tabular-digits mt-0.5">147-159</span>
</div>
</div>
</main>
<!-- SECTION 6: HIGH-AFFORDANCE GLOVE-FRIENDLY WORKOUT CONTROLS -->
<footer class="w-full pb-2 z-20 flex flex-col items-center gap-2.5">
<div class="w-full flex items-center gap-3">
<!-- Left Button: Pause -->
<button class="flex-1 min-h-[56px] h-14 rounded-full bg-surface-container-low border border-outline text-on-surface flex items-center justify-center gap-2 active:bg-surface-container-high active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="pause">pause</span>
<span class="font-headline-sm text-title-md font-extrabold tracking-wider uppercase">PAUSE</span>
</button>
<!-- Right Button: Stop & Save -->
<button class="flex-1 min-h-[56px] h-14 rounded-full bg-secondary-container/20 border-2 border-secondary-container text-on-surface flex items-center justify-center gap-2 active:bg-secondary-container active:text-on-secondary active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined text-[22px] text-secondary-container" data-icon="stop">stop</span>
<span class="font-headline-sm text-title-md font-extrabold tracking-wider uppercase text-on-surface">STOP &amp; SAVE</span>
</button>
</div>
<!-- Tactical Micro Footnote -->
<div class="flex items-center gap-1.5 font-label-sm text-[10px] text-outline font-medium tracking-wide">
<span class="material-symbols-outlined text-[13px] opacity-70" data-icon="lock">lock</span>
<span>Long press or tap controls · Immersion lock active</span>
</div>
</footer>
</div>
<script>
    // Live ticking duration logic for authentic workout glanceability
    let totalSeconds = 2322; // 00:38:42
    const timerElement = document.getElementById('workoutTimer');
    setInterval(() => {
      totalSeconds++;
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      timerElement.textContent = `${hrs}:${mins}:${secs}`;
    }, 1000);
  </script>
